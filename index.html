<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f5f5f7">
<title>سفره</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f7;
    --card: #ffffff;
    --ink: #1d1d1f;
    --ink-soft: #6e6e73;
    --ink-faint: #a1a1a6;
    --line: rgba(0,0,0,0.07);
    --accent: #ff9f0a;
    --accent-warm: #ff7a00;
    --blue: #007aff;
    --green: #34c759;
    --red: #ff3b30;
    --shadow: 0 1px 3px rgba(0,0,0,0.04), 0 8px 30px rgba(0,0,0,0.06);
    --radius: 22px;
    --radius-sm: 16px;
  }

  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html, body {
    font-family:'Vazirmatn', -apple-system, BlinkMacSystemFont, sans-serif;
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    overscroll-behavior:none;
  }

  body {
    min-height:100vh; min-height:100dvh;
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
  }

  button { font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }
  input { font-family:inherit; }
  .hidden { display:none !important; }

  /* ---------- ورود ---------- */
  #lock {
    position:fixed; inset:0;
    background:linear-gradient(170deg, #fff7ec 0%, #f5f5f7 55%);
    display:flex; flex-direction:column; align-items:center; justify-content:safe center;
    overflow-y:auto; padding:24px 16px; z-index:100;
  }
  .lock-emoji { font-size:54px; margin-bottom:18px; animation:pop .6s cubic-bezier(.2,.8,.2,1); }
  @keyframes pop { from{transform:scale(.5);opacity:0} to{transform:scale(1);opacity:1} }
  #lock h1 { font-size:26px; font-weight:600; letter-spacing:-.5px; }
  #lock p { color:var(--ink-soft); font-size:15px; margin-top:8px; text-align:center; line-height:1.7; }

  .pin-wrap { width:min(100%, 252px); margin-top:24px; }
  .pin-wrap label { display:block; margin-bottom:6px; font-size:14px; }
  #pinInput {
    width:100%; min-height:48px; padding:8px 12px;
    border:1px solid var(--ink-faint); border-radius:14px; background:var(--card);
    color:var(--ink); font-size:20px; letter-spacing:.35em; text-align:center;
  }
  #pinInput:focus-visible, .key:focus-visible { outline:2px solid var(--blue); outline-offset:3px; }
  #pinInput[aria-invalid="true"] { border-color:var(--red); }
  .keypad { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:12px; direction:ltr; }
  .key {
    height:48px; border-radius:16px; background:rgba(255,255,255,0.8);
    font-size:24px; box-shadow:0 1px 2px rgba(0,0,0,0.04);
    transition:transform .1s, background .15s;
  }
  .key:active { transform:scale(.92); background:rgba(0,0,0,0.05); }
  .key.fn { background:transparent; box-shadow:none; font-size:16px; color:var(--ink-soft); }
  .lock-hint { margin-top:12px; font-size:14px; color:#a82620; min-height:22px; }

  /* ---------- هدر ---------- */
  header {
    position:sticky; top:0; z-index:20;
    background:rgba(245,245,247,0.8);
    backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
    border-bottom:1px solid var(--line); padding:14px 20px 12px;
  }
  .app-title { font-size:15px; font-weight:600; text-align:center; letter-spacing:-.3px; display:flex; align-items:center; justify-content:center; gap:7px; }
  .sync-dot { width:7px; height:7px; border-radius:50%; background:var(--ink-faint); transition:background .3s; }
  .sync-dot.online { background:var(--green); }
  .sync-dot.offline { background:var(--red); }
  .date-nav { display:flex; align-items:center; justify-content:space-between; margin-top:10px; }
  .date-nav button {
    width:34px; height:34px; border-radius:50%; background:var(--card);
    box-shadow:0 1px 2px rgba(0,0,0,0.05); display:flex; align-items:center; justify-content:center;
    font-size:18px; color:var(--blue); transition:transform .1s;
  }
  .date-nav button:active { transform:scale(.9); }
  .date-label { text-align:center; }
  .date-big { font-size:19px; font-weight:600; letter-spacing:-.4px; }
  .date-small { font-size:12px; color:var(--ink-soft); margin-top:2px; }
  .today-pill { display:inline-block; margin-top:5px; font-size:11px; font-weight:500; color:var(--green); background:rgba(52,199,89,0.12); padding:2px 10px; border-radius:20px; }

  /* ---------- محتوا ---------- */
  main { padding:18px 16px 40px; max-width:480px; margin:0 auto; }

  .meal { background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); margin-bottom:16px; overflow:hidden; animation:rise .45s cubic-bezier(.2,.8,.2,1) backwards; }
  .meal:nth-child(1){animation-delay:.04s} .meal:nth-child(2){animation-delay:.1s} .meal:nth-child(3){animation-delay:.16s}
  @keyframes rise { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:translateY(0)} }

  .meal-head { display:flex; align-items:center; gap:11px; padding:15px 18px 13px; }
  .meal-icon { width:38px; height:38px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0; }
  .icon-b { background:linear-gradient(145deg,#fff0d4,#ffe1a8); }
  .icon-l { background:linear-gradient(145deg,#ffe0d4,#ffc9a8); }
  .icon-d { background:linear-gradient(145deg,#dfe4ff,#c4cdff); }
  .meal-name { font-size:16px; font-weight:600; letter-spacing:-.3px; }
  .meal-sub { font-size:12px; color:var(--ink-faint); margin-top:1px; }

  .meal-body { padding:0 18px 16px; }
  .meal-text { font-size:16px; line-height:1.7; color:var(--ink); white-space:pre-wrap; word-break:break-word; padding:6px 2px; }
  .meal-empty { font-size:15px; color:var(--ink-faint); padding:6px 2px; }
  .meal-input { width:100%; border:none; outline:none; resize:none; background:#f5f5f7; border-radius:14px; padding:12px 14px; font-size:16px; line-height:1.7; color:var(--ink); min-height:52px; }
  .meal-input::placeholder { color:var(--ink-faint); }

  .meal-actions { display:flex; gap:8px; margin-top:10px; justify-content:flex-start; }
  .btn { padding:9px 18px; border-radius:13px; font-size:14px; font-weight:600; transition:transform .1s, opacity .15s; }
  .btn:active { transform:scale(.95); }
  .btn-primary { background:var(--accent); color:#fff; }
  .btn-ghost { background:#f0f0f2; color:var(--ink-soft); }
  .btn-edit { font-size:13px; font-weight:500; color:var(--blue); padding:6px 4px; margin-top:4px; }
  .meta { font-size:11px; color:var(--ink-faint); margin-top:8px; }

  .foot { text-align:center; padding:8px 0 4px; font-size:12px; color:var(--ink-faint); }
  .foot button { color:var(--ink-faint); font-size:12px; text-decoration:underline; }

  .saving-toast {
    position:fixed; bottom:calc(24px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%) translateY(20px);
    background:rgba(0,0,0,0.82); color:#fff; font-size:13px; font-weight:500;
    padding:10px 20px; border-radius:30px; opacity:0; transition:all .3s;
    backdrop-filter:blur(10px); z-index:50; pointer-events:none;
  }
  .saving-toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  .saving-toast.err { background:rgba(255,59,48,0.92); }

  .setup-note {
    position:fixed; inset:0; background:var(--bg); z-index:200; padding:40px 28px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
  }
  .setup-note h2 { font-size:20px; font-weight:600; margin-bottom:12px; }
  .setup-note p { color:var(--ink-soft); font-size:15px; line-height:1.9; }
  .setup-note code { background:#fff; padding:2px 7px; border-radius:6px; font-size:13px; }
</style>
</head>
<body>

<!-- اخطار تنظیم نشدن -->
<div id="setupNote" class="setup-note hidden">
  <div style="font-size:44px;margin-bottom:16px">⚙️</div>
  <h2>هنوز به دیتابیس وصل نشده</h2>
  <p>باید مقدار <code>SUPABASE_URL</code> و <code>SUPABASE_KEY</code> رو<br>توی کد وارد کنی. راهنمای کامل رو از من بگیر.</p>
</div>

<!-- صفحه ورود -->
<div id="lock">
  <div class="lock-emoji">🍲</div>
  <h1>سفره</h1>
  <div class="pin-wrap">
    <label for="pinInput">رمز چهاررقمی</label>
    <input id="pinInput" type="password" inputmode="numeric" autocomplete="off"
           dir="ltr" aria-describedby="lockHint">
    <div class="keypad" id="keypad" role="group" aria-label="صفحه‌کلید عددی"></div>
  </div>
  <div class="lock-hint" id="lockHint" role="status"></div>
</div>

<!-- اپ اصلی -->
<div id="app" class="hidden">
  <header>
    <div class="app-title"><span class="sync-dot" id="syncDot"></span>🍲 سفره‌ی ما</div>
    <div class="date-nav">
      <button id="prevDay" aria-label="روز قبل">‹</button>
      <div class="date-label">
        <div class="date-big" id="dateBig"></div>
        <div class="date-small" id="dateSmall"></div>
        <div id="todayPill"></div>
      </div>
      <button id="nextDay" aria-label="روز بعد">›</button>
    </div>
  </header>

  <main id="meals"></main>

  <div class="foot">
    <button id="logout">خروج</button>
  </div>
</div>

<div class="saving-toast" id="toast">ذخیره شد</div>


<script type="module">
import { createClient } from '@supabase/supabase-js';
/* ═══════════════════════════════════════════════════════
   ⬇️ این سه مقدار رو پر کن (راهنما رو از Claude بگیر)
   ═══════════════════════════════════════════════════════ */
const SUPABASE_URL = import.meta.env.VITE_SUPABASE_URL ?? '';
const SUPABASE_KEY = import.meta.env.VITE_SUPABASE_KEY ?? '';
const PIN          = import.meta.env.VITE_PIN || '1373';
/* ═══════════════════════════════════════════════════════ */

const MEALS = [
  { key:'b', name:'صبحانه', sub:'شروع روز',  icon:'🌅', cls:'icon-b' },
  { key:'l', name:'ناهار',  sub:'وسط روز',   icon:'☀️', cls:'icon-l' },
  { key:'d', name:'شام',    sub:'پایان روز', icon:'🌙', cls:'icon-d' },
];

// چک تنظیمات
let sb = null;
const configured = SUPABASE_URL.startsWith('http') && SUPABASE_KEY.length > 20;
if (!configured) {
  document.getElementById('setupNote').classList.remove('hidden');
  document.getElementById('lock').classList.add('hidden');
} else {
  sb = createClient(SUPABASE_URL, SUPABASE_KEY);
}

// ====== رمز ======
const keypad = document.getElementById('keypad');
const pinInput = document.getElementById('pinInput');
const lockHint = document.getElementById('lockHint');
const persianDigits = '۰۱۲۳۴۵۶۷۸۹';
const arabicDigits = '٠١٢٣٤٥٦٧٨٩';

function updatePin(value) {
  const digits = value
    .replace(/[۰-۹]/g, digit => persianDigits.indexOf(digit))
    .replace(/[٠-٩]/g, digit => arabicDigits.indexOf(digit))
    .replace(/[^0-9]/g, '')
    .slice(0, 4);

  if (pinInput.value !== digits) pinInput.value = digits;
  lockHint.textContent = '';
  pinInput.removeAttribute('aria-invalid');
  if (digits.length < 4) return;

  pinInput.value = '';
  if (digits === PIN) {
    localStorage.setItem('sofreh_unlocked', '1');
    enterApp();
  } else {
    pinInput.setAttribute('aria-invalid', 'true');
    lockHint.textContent = 'رمز درست نیست. دوباره امتحان کن.';
  }
}

pinInput.addEventListener('input', () => updatePin(pinInput.value));

for (const digit of [1, 2, 3, 4, 5, 6, 7, 8, 9, 0]) {
  const button = document.createElement('button');
  button.type = 'button';
  button.className = 'key';
  button.textContent = persianDigits[digit];
  if (digit === 0) button.style.gridColumn = '2';
  button.onclick = () => updatePin(pinInput.value + digit);
  keypad.appendChild(button);
}

const deleteKey = document.createElement('button');
deleteKey.type = 'button';
deleteKey.className = 'key fn';
deleteKey.textContent = '⌫';
deleteKey.setAttribute('aria-label', 'حذف رقم آخر');
deleteKey.onclick = () => updatePin(pinInput.value.slice(0, -1));
keypad.appendChild(deleteKey);

function enterApp(){
  document.getElementById('lock').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  initApp();
}
document.getElementById('logout').onclick = () => { localStorage.removeItem('sofreh_unlocked'); location.reload(); };

// ====== تاریخ ======
let viewDate = new Date();
function dateKey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function isToday(d){ return dateKey(d)===dateKey(new Date()); }
function faDate(d){
  const big = new Intl.DateTimeFormat('fa-IR',{weekday:'long',day:'numeric',month:'long'}).format(d);
  const small = new Intl.DateTimeFormat('fa-IR',{year:'numeric'}).format(d)+' • '+new Intl.DateTimeFormat('en-GB',{day:'numeric',month:'short'}).format(d);
  return { big, small };
}
function renderDate(){
  const {big,small}=faDate(viewDate);
  document.getElementById('dateBig').textContent=big;
  document.getElementById('dateSmall').textContent=small;
  document.getElementById('todayPill').innerHTML = isToday(viewDate)?'<span class="today-pill">امروز</span>':'';
}
document.getElementById('prevDay').onclick=()=>{ viewDate.setDate(viewDate.getDate()-1); refresh(); };
document.getElementById('nextDay').onclick=()=>{ viewDate.setDate(viewDate.getDate()+1); refresh(); };

// ====== دیتابیس Supabase ======
function setSync(state){
  const dot=document.getElementById('syncDot');
  dot.className='sync-dot '+(state||'');
}
async function loadDay(key){
  try {
    const { data, error } = await sb.from('meals').select('data').eq('day', key).maybeSingle();
    if (error) throw error;
    setSync('online');
    return data ? data.data : {};
  } catch(e){ setSync('offline'); console.error(e); return dayData; }
}
async function saveDay(key, data){
  try {
    const { error } = await sb.from('meals').upsert({ day:key, data:data }, { onConflict:'day' });
    if (error) throw error;
    setSync('online'); return true;
  } catch(e){ setSync('offline'); console.error(e); return false; }
}
function timeNow(){ return new Intl.DateTimeFormat('fa-IR',{hour:'2-digit',minute:'2-digit'}).format(new Date()); }
function showToast(msg, err){
  const t=document.getElementById('toast'); t.textContent=msg;
  t.className='saving-toast show'+(err?' err':''); setTimeout(()=>t.classList.remove('show'),1600);
}

// ====== رندر ======
let dayData = {};
async function refresh(){ renderDate(); dayData = await loadDay(dateKey(viewDate)); renderMeals(); }

function renderMeals(){
  const c=document.getElementById('meals'); c.innerHTML='';
  MEALS.forEach(m=>{
    const card=document.createElement('div'); card.className='meal';
    card.innerHTML=`
      <div class="meal-head">
        <div class="meal-icon ${m.cls}">${m.icon}</div>
        <div><div class="meal-name">${m.name}</div><div class="meal-sub">${m.sub}</div></div>
      </div>
      <div class="meal-body" id="body-${m.key}"></div>`;
    c.appendChild(card);
    renderMealBody(m, dayData[m.key]||null, false);
  });
}
function renderMealBody(m, entry, editing){
  const body=document.getElementById('body-'+m.key);
  if(editing){
    body.innerHTML=`
      <textarea class="meal-input" id="input-${m.key}" placeholder="مثلاً: قرمه‌سبزی با برنج" rows="1">${entry?escapeHtml(entry.text):''}</textarea>
      <div class="meal-actions">
        <button class="btn btn-primary" id="save-${m.key}">ذخیره</button>
        <button class="btn btn-ghost" id="cancel-${m.key}">بی‌خیال</button>
      </div>`;
    const ta=document.getElementById('input-'+m.key); autosize(ta); ta.focus();
    ta.addEventListener('input',()=>autosize(ta));
    document.getElementById('save-'+m.key).onclick=async()=>{
      const text=ta.value.trim();
      if(text) dayData[m.key]={text,time:timeNow()}; else delete dayData[m.key];
      const ok=await saveDay(dateKey(viewDate),dayData);
      showToast(ok?(text?'ذخیره شد ✓':'پاک شد'):'خطا در ذخیره — اینترنت؟', !ok);
      renderMealBody(m, dayData[m.key]||null, false);
    };
    document.getElementById('cancel-'+m.key).onclick=()=>renderMealBody(m, dayData[m.key]||null, false);
  } else {
    if(entry){
      body.innerHTML=`
        <div class="meal-text">${escapeHtml(entry.text)}</div>
        <div class="meta">ثبت ساعت ${entry.time}</div>
        <button class="btn-edit" id="edit-${m.key}">ویرایش</button>`;
    } else {
      body.innerHTML=`
        <div class="meal-empty">هنوز چیزی ثبت نشده</div>
        <button class="btn-edit" id="edit-${m.key}">+ اضافه کن</button>`;
    }
    document.getElementById('edit-'+m.key).onclick=()=>renderMealBody(m, dayData[m.key]||null, true);
  }
}
function autosize(ta){ ta.style.height='auto'; ta.style.height=ta.scrollHeight+'px'; }
function escapeHtml(s){ return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// ====== شروع + همگام لحظه‌ای ======
function initApp(){
  refresh();
  // گوش دادن به تغییرات لحظه‌ای از گوشی طرف مقابل
  sb.channel('meals-rt')
    .on('postgres_changes', { event:'*', schema:'public', table:'meals' }, payload => {
      if (payload.new && payload.new.day === dateKey(viewDate) && !document.querySelector('.meal-input')){
        dayData = payload.new.data || {}; renderMeals();
      }
    })
    .subscribe();
}
if (configured && localStorage.getItem('sofreh_unlocked') === '1') enterApp();
</script>
</body>
</html>
